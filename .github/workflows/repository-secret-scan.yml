name: Repository Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan tracked source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Enforce workflow security policy
        run: node scripts/workflow-security-gate.mjs

      - name: Test repository secret scanner
        run: node --test scripts/repository-secret-scan.test.mjs

      - name: Scan tracked source without printing values
        run: node scripts/repository-secret-scan.mjs

      - name: Scan exact curated public archive without printing values
        run: node scripts/repository-secret-scan.mjs --public-export HEAD
