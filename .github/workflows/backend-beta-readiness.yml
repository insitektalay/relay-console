name: Backend Beta Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend beta readiness
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Enforce workflow security policy
        run: node scripts/workflow-security-gate.mjs

      - name: Test workflow security policy failures
        run: node --test scripts/workflow-security-gate.test.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Set up Python for the Hermes fake-worker contract
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hermes-runtime/requirements-test.lock

      - name: Install the locked Hermes fake-worker test dependency
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          --requirement hermes-runtime/requirements-test.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Railway backend dependency graph
        run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: backend

      - name: Run non-mutating backend correctness lint
        run: pnpm run lint:backend

      - name: Enforce TypeScript unused-code ratchets
        run: |
          pnpm run test:typescript-unused-gate
          pnpm run unused:check:backend

      - name: Audit codebase remediation controls
        run: |
          pnpm run test:codebase-remediation
          pnpm run test:backend-lint-boundary
          pnpm run test:runtime-reachability-gate
          pnpm run reachability:check
          pnpm run test:source-structure-gate
          pnpm run source-structure:check
          pnpm run test:repository-ownership
          pnpm run repository:ownership:check
          pnpm run goal:codebase-remediation

      - name: Build backend
        run: pnpm --dir backend run build

      - name: Run backend production env and migration startup checks
        run: |
          pnpm run test:production-secret-audit
          pnpm run test:production-secret-provider
          pnpm --dir backend run test:beta-readiness

      - name: Enforce core-risk coverage and report test volume
        run: |
          pnpm run test:backend-test-volume
          pnpm run backend:test-volume
          pnpm run test:backend:core-risk-coverage

      - name: Verify release-lane contracts
        run: |
          pnpm run marketplace:validate
          pnpm run marketplace:catalog:check
          pnpm run test:marketplace-semantic-parity
          pnpm run marketplace:semantic-parity
          pnpm run marketplace:icons:check
          pnpm run test:marketplace-icons
          pnpm run marketplace:release-manifest:check
          pnpm run marketplace:provider-acceptance
          pnpm run test:marketplace-release-manifest
          pnpm run test:marketplace-provider-acceptance
          pnpm run test:marketplace-release-gate
          pnpm run test:marketplace-freeze-source-audit
          pnpm run test:release-candidate
          pnpm run test:release-freeze
          pnpm run test:apple-distribution-evidence
          pnpm run test:client-version-contract
          pnpm run test:railway-release-topology
          pnpm run test:railway-release-configuration
          pnpm run test:release-remote-evidence
          pnpm run test:public-launch-surface-gate
          pnpm run test:production-smoke-evidence
          pnpm run test:failure-recovery-gate
          pnpm run test:failure-recovery-evidence
          pnpm run test:billing-release-evidence
          pnpm run test:launch-governance-evidence
          pnpm run test:app-store-release-evidence
          pnpm run test:macos-publication-evidence
          pnpm run test:launch-journey-evidence
          pnpm run test:production-checklist-evidence
          pnpm run verify:failure-recovery
          pnpm run test:release-lane
          pnpm run test:launch-product-contract
          pnpm run test:product-contract-terminology

      - name: Run backend Jest suite
        run: pnpm --dir backend exec jest --runInBand

      - name: Test dependency licence policy
        run: pnpm run test:dependency-license-gate && pnpm run test:dependency-license-inventory

      - name: Test dependency advisory policy
        run: >-
          pnpm run test:dependency-advisory-gate &&
          pnpm run test:dependency-backports &&
          pnpm run test:python-dependency-lock

      - name: Check backend production licence inventory
        run: pnpm run dependency:licenses:backend

      - name: Check published backend dependency inventory
        run: pnpm run dependency:licenses:inventory:backend

      - name: Audit backend production dependencies
        run: pnpm --dir backend run audit:prod

  container-security:
    name: Production container supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Enforce workflow security policy
        run: node scripts/workflow-security-gate.mjs

      - name: Enforce static container supply-chain policy
        run: node --test scripts/container-supply-chain-gate.test.mjs

      - name: Build backend image with SBOM and max-mode provenance
        run: |
          mkdir -p container-evidence
          docker buildx build backend \
            --file backend/Dockerfile \
            --tag "clawchat-backend:${GITHUB_SHA}" \
            --attest=type=sbom \
            --attest=type=provenance,mode=max \
            --metadata-file container-evidence/backend-metadata.json \
            --output=type=oci,dest=container-evidence/backend-image.tar

      - name: Build Hermes image with SBOM and max-mode provenance
        run: |
          docker buildx build hermes-runtime \
            --file hermes-runtime/Dockerfile \
            --tag "clawchat-hermes-runtime:${GITHUB_SHA}" \
            --attest=type=sbom \
            --attest=type=provenance,mode=max \
            --metadata-file container-evidence/hermes-metadata.json \
            --output=type=oci,dest=container-evidence/hermes-image.tar

      - name: Verify and extract image attestations
        run: |
          mkdir -p \
            container-evidence/backend-oci \
            container-evidence/hermes-oci \
            container-evidence/attestations
          tar -xf container-evidence/backend-image.tar \
            -C container-evidence/backend-oci
          tar -xf container-evidence/hermes-image.tar \
            -C container-evidence/hermes-oci
          node scripts/container-supply-chain-gate.mjs \
            --layout container-evidence/backend-oci \
            --metadata container-evidence/backend-metadata.json \
            --image-name clawchat/backend \
            --evidence container-evidence/attestations
          node scripts/container-supply-chain-gate.mjs \
            --layout container-evidence/hermes-oci \
            --metadata container-evidence/hermes-metadata.json \
            --image-name clawchat/hermes-runtime \
            --evidence container-evidence/attestations

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: container-evidence/backend-image.tar
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          format: json
          output: container-evidence/backend-trivy.json
          exit-code: "0"
          version: v0.72.0

      - name: Scan Hermes image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: container-evidence/hermes-image.tar
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          format: json
          output: container-evidence/hermes-trivy.json
          exit-code: "0"
          version: v0.72.0
          skip-setup-trivy: true

      - name: Reject High and Critical image findings
        run: >-
          node scripts/trivy-report-gate.mjs
          container-evidence/backend-trivy.json
          container-evidence/hermes-trivy.json

      - name: Preserve compact container security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-container-security-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            container-evidence/*-metadata.json
            container-evidence/*-trivy.json
            container-evidence/attestations/*.json
