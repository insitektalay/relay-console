[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clawchat-hermes-runtime-worker"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.1",
  "hermes-agent==0.19.0",
]

[project.scripts]
clawchat-hermes-worker = "hermes_runtime_worker.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
